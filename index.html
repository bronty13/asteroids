      }

        margin: 0; height: 100%; background: #000; color: #fff; overflow: hidden;
        overscroll-behavior: none; touch-action: none;
        -webkit-user-select: none; user-select: none; -webkit-touch-callout: none;

      .cluster.r { right: calc(env(safe-area-inset-right) + 14px); }

      .b {
        pointer-events: auto; width: var(--size); height: var(--size); border-radius: 50%;
        background: var(--btn); border: 1.5px solid var(--btn-edge);
        display: grid; place-items: center;
        font: 600 12px/1 ui-monospace, Menlo, monospace; letter-spacing: 1px; color: rgba(255,255,255,0.75);
      }
      .b svg { width: 46%; height: 46%; stroke: rgba(255,255,255,0.8); fill: none; stroke-width: 2.4; stroke-linejoin: round; }
      .b.down { background: var(--btn-down); }

      #pause {
        position: absolute; top: calc(env(safe-area-inset-top) + 10px); right: calc(env(safe-area-inset-right) + 12px);
        width: 40px; height: 40px; border-radius: 10px;
      }
